name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # `macos-latest` rather than a pinned version: an unavailable label makes the
    # job unrunnable, and this workflow's job is to prove the code builds and
    # passes, not to pin a runner image. The minimum supported macOS version is a
    # compile-time property — Package.swift declares `.macOS(.v14)` and the
    # compiler enforces availability against it — so it is checked by the build
    # rather than by finding an old runner.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./Scripts/build-app.sh

      - name: Verify the signature
        run: codesign --verify --verbose=2 dist/GPUWatch.app
