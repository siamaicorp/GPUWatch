name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS 14 is the minimum supported platform; macos-15 covers the current
    # toolchain. Both are needed: the deployment target is a claim that should be
    # checked, not just documented.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./Scripts/build-app.sh

      - name: Report the bundle
        run: |
          ls -la dist/GPUWatch.app/Contents/
          codesign --verify --verbose=2 dist/GPUWatch.app
